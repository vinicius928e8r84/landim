<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>🔥 Oferta do Landim: 100% OFF</title>
<style>
  :root { --ink: #111; --paper: #f6f3ec; --or: #f26b21; --mute: #cfcabd; --card: #1c1c1c; --line: #2a2a2a; }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body { margin: 0; background: var(--ink); color: var(--paper);
         font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; line-height: 1.45; }
  main { max-width: 560px; min-height: 100vh; margin: 0 auto; padding: 28px 22px 60px; overflow: hidden; }
  h1 { font-size: 31px; line-height: 1.12; font-weight: 900; letter-spacing: -0.5px; margin: 10px 0 12px; }
  h1 mark { background: var(--or); color: var(--ink); padding: 0 6px; }
  h2 { font-size: 21px; font-weight: 900; margin: 34px 0 12px; }
  h2 span { color: var(--or); }
  p { margin: 0 0 12px; }
  .c { text-align: center; }
  .olho { color: var(--or); font-weight: 800; letter-spacing: 1.5px; font-size: 12.5px; text-transform: uppercase; margin: 0; }
  .mute { color: var(--mute); }
  .peq { font-size: 14px; color: var(--mute); }
  .big { font-size: 76px; line-height: 1; margin: 0 0 6px; }
  .centro { text-align: center; padding-top: 14vh; }

  .btn { display: block; width: 100%; border: 0; border-radius: 999px; background: var(--or); color: var(--ink); text-align: center;
         font: inherit; font-weight: 900; font-size: 20px; padding: 19px 16px; margin: 18px 0 10px; cursor: pointer; }
  .btn.pulsa { animation: pulsa 1.4s ease-in-out infinite; }
  .btn.oco { background: none; border: 2px solid var(--paper); color: var(--paper); font-size: 16px; padding: 12px 16px; margin: 10px 0; }
  .btn.min { display: inline-block; width: auto; font-size: 15px; padding: 12px 18px; margin: 0; }
  @keyframes pulsa { 50% { transform: scale(1.035); } }
  @keyframes treme { 20%, 60% { transform: translateX(-7px) rotate(-2deg); } 40%, 80% { transform: translateX(7px) rotate(2deg); } }
  @keyframes sobe { from { opacity: 0; transform: translateY(14px); } }
  .treme { animation: treme .45s; }
  button:focus-visible, input:focus-visible, label.btn:focus-within { outline: 3px solid var(--paper); outline-offset: 2px; }

  input[type=text] { width: 100%; background: #171717; color: var(--paper); border: 2px solid #3a3a3a; border-radius: 12px;
                     padding: 13px 14px; font: inherit; font-size: 17px; }
  input[type=text]:focus { outline: none; border-color: var(--or); }
  label.cp { display: block; font-weight: 800; margin: 18px 0 6px; }
  .linha { display: flex; gap: 8px; }
  .linha input { min-width: 0; }
  .aviso { min-height: 22px; font-weight: 800; color: var(--or); margin: 8px 0 0; }

  /* caça ao cupom */
  .prog { height: 10px; background: #2a2a2a; border-radius: 99px; overflow: hidden; margin: 14px 0 20px; }
  .prog i { display: block; height: 100%; background: var(--or); transition: width .5s; }
  .alt { display: block; width: 100%; text-align: left; background: none; border: 2px solid #3a3a3a; border-radius: 12px; color: var(--paper);
         font: inherit; font-size: 17px; font-weight: 700; padding: 15px 14px; margin: 0 0 8px; cursor: pointer; }
  .achou { text-align: center; animation: sobe .3s; }

  /* oferta desbloqueada */
  .foto { margin: 0 0 14px; border-radius: 14px; overflow: hidden; position: relative; }
  .foto img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .foto figcaption { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(17,17,17,.78); font-size: 11.5px; color: var(--mute); padding: 4px 8px; text-align: center; }
  .preco { text-align: center; margin: 10px 0 6px; }
  .preco s { color: var(--mute); font-size: 20px; }
  .preco strong { display: block; font-size: 60px; font-weight: 900; color: var(--or); line-height: 1.05; font-variant-numeric: tabular-nums; }
  .selo { display: inline-block; background: var(--paper); color: var(--ink); font-weight: 900; padding: 4px 12px; transform: rotate(-4deg); margin-bottom: 12px; }
  .vagas { text-align: center; font-weight: 800; color: var(--or); }
  ul.bonus { list-style: none; padding: 0; margin: 0; }
  ul.bonus li { padding: 10px 0 10px 34px; position: relative; border-bottom: 1px solid var(--line); font-size: 17px; }
  ul.bonus li::before { content: "🎁"; position: absolute; left: 0; }
  ul.bonus small { display: block; color: var(--or); font-weight: 700; }
  .garantia { border: 2px dashed var(--or); padding: 16px; margin-top: 30px; text-align: center; font-size: 16px; }
  .garantia b { color: var(--or); }

  /* compra aprovada */
  #cert { display: block; width: 100%; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.6); margin-top: 6px; }
  .depo { background: var(--card); border-left: 4px solid #3a3a3a; padding: 14px 16px; margin: 0 0 10px; font-size: 16px; }
  .depo.meu { border-left-color: var(--or); }
  .depo cite { display: block; margin-top: 6px; color: var(--mute); font-style: normal; font-size: 14px; }
  .album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .album img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }

  /* área do Landim */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--card); border-radius: 12px; padding: 12px; }
  .tile small { display: block; color: var(--mute); font-size: 12.5px; }
  .tile b { font-size: 24px; font-weight: 900; color: var(--or); }
  .cadeado { border: 2px dashed var(--or); border-radius: 14px; padding: 18px; text-align: center; }
  .cadeado b { font-variant-numeric: tabular-nums; }

  footer { margin-top: 44px; text-align: center; font-size: 12px; color: #77736a; }
  footer button { background: none; border: 0; color: var(--mute); font: inherit; text-decoration: underline; cursor: pointer; padding: 10px; }

  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; background: var(--paper); color: var(--ink); font-weight: 800; font-size: 13px;
           padding: 8px 14px; border-radius: 999px; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; animation: sobe .3s; pointer-events: none; }
  .confete { position: fixed; top: -30px; z-index: 40; font-size: 22px; pointer-events: none; animation: cai linear forwards; }
  @keyframes cai { to { transform: translateY(115vh) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { .btn.pulsa, .confete, .treme { animation: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script src="../config.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- o que pode mudar sem mexer no resto ---------- */
  var CUPONS = ["FECHETRANS"];  // cupom da parede; vale com ou sem espaço, maiúsculo ou minúsculo
  var BONUS = [["🍲", "Feijoada de sábado", "a melhor do planeta Terra"],
               ["🎵", "Trilha sonora da missão", "é só escanear a lua de vinil"],
               ["🎮", "Acesso VIP à garagem", "jogos, descanso e resenha"]];
  var PISTAS = [
    { q: "O que está escrito no selo preto colado no estouro laranja?", alt: ["50% OFF", "100% OFF", "FRETE GRÁTIS"], certa: 1 },
    { q: "Para onde o foguete da parede está indo?", alt: ["Para a lua, que é um disco de vinil", "Para Marte", "Para a geladeira"], certa: 0 },
    { q: "Em que ano termina a linha do tempo desenhada na parede?", alt: ["2030", "2046", "2036"], certa: 2 }
  ];
  // Mural de clientes: frases de quem comprou. Com os campos vazios, cada celular mostra só a própria frase
  // e as FRASES_FIXAS. Preenchidos, as frases vão para um formulário do Google e são lidas da planilha dele.
  var MURAL = { form: "", campoNome: "", campoFrase: "", planilha: "" };
  var FRASES_FIXAS = [];        // { nome, frase, quando }: fixadas depois da festa
  var FOTOS_DA_FESTA = 6;       // fotos/festa-1.jpg … festa-6.jpg; só aparecem as que existirem

  var abertura = new Date((window.LANDIM && LANDIM.ABERTURA) || "2036-11-16T00:00:00-03:00");
  var ANO_FIM = abertura.getFullYear();
  var DATA_FIM = dois(abertura.getDate()) + "/" + dois(abertura.getMonth() + 1) + "/" + ANO_FIM;
  var ANIV = new Date(abertura.getTime()); ANIV.setFullYear(2027);   // primeiro aniversário depois da festa
  var DATA_ANIV = dois(ANIV.getDate()) + "/" + dois(ANIV.getMonth() + 1) + "/2027";

  /* ---------- estado e memória ---------- */
  var CHAVE = "landim-oferta-v1";
  var S = { nome: "", frase: "", cupom: false, pedido: null, selfie: "", enviado: false };
  var teste2027 = false, relogios = [];
  var app = document.getElementById("app");

  function lembrar() { try { return JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { return null; } }
  function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(S)); } catch (e) {} }
  function dois(n) { return String(n).padStart(2, "0"); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function primeiroNome() { return S.nome.split(" ")[0]; }
  function depois(fn, ms) { var t = setTimeout(fn, ms); relogios.push(t); return t; }
  function cada(fn, ms) { var t = setInterval(fn, ms); relogios.push(t); return t; }
  function tela(html) {
    relogios.forEach(function (t) { clearTimeout(t); clearInterval(t); }); relogios = [];
    app.innerHTML = html; window.scrollTo(0, 0);
  }
  var ACOES = {};
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-a]");
    if (el && ACOES[el.dataset.a]) ACOES[el.dataset.a](el);
  });

  /* ---------- miudezas ---------- */
  function confete() {
    var pecas = ["🎉", "🚀", "💰", "🔥", "🎵", "✳️"];
    for (var i = 0; i < 50; i++) {
      var c = document.createElement("span"); c.className = "confete"; c.textContent = pecas[i % pecas.length];
      c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = 2 + Math.random() * 2.5 + "s"; c.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(c); setTimeout(function (el) { el.remove(); }, 6000, c);
    }
  }
  function avisosDeVenda() {
    var quem = ["Alguém da cozinha", "O cara do violão", "Uma prima distante", "O vizinho", "Quem trouxe o gelo", "Uma pessoa de bom gosto"];
    var oque = ["acabou de comprar", "garantiu a vaga", "está finalizando o pedido", "comprou e já voltou pra feijoada"];
    cada(function () {
      var t = document.createElement("div"); t.className = "toast";
      t.textContent = "🔔 " + quem[Math.floor(Math.random() * quem.length)] + " " + oque[Math.floor(Math.random() * oque.length)];
      document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200);
    }, 6500);
  }
  function rodape() {
    return "<footer>Resultados podem variar. Feijoada sujeita à disponibilidade. Oferta válida até " + DATA_FIM + ".<br>" +
           '<button data-a="landim">Você é o Landim? Entre aqui.</button></footer>';
  }
  // o número do pedido é o dia e a hora da compra
  function fazerPedido() {
    var d = new Date();
    S.pedido = { iso: d.toISOString(), num: dois(d.getDate()) + dois(d.getMonth() + 1) + "-" + dois(d.getHours()) + dois(d.getMinutes()),
                 txt: dois(d.getDate()) + "/" + dois(d.getMonth() + 1) + "/" + d.getFullYear() + ", " + dois(d.getHours()) + "h" + dois(d.getMinutes()) };
  }

  /* ---------- 1. entrada ---------- */
  function entrada() {
    tela('<div class="centro"><div class="big">🔒</div><p class="olho">Acesso restrito</p><h1>Oferta <mark>bloqueada</mark></h1>' +
      '<p class="mute">Esta oferta só abre para quem está dentro do quarto do Landim. Prove: são três perguntas, e as respostas estão na parede.</p>' +
      '<button class="btn pulsa" data-a="comecar">COMEÇAR A CAÇA</button></div>');
  }
  ACOES.comecar = function () { pista(0); };

  /* ---------- 2. caça ao cupom: um toque por pergunta ---------- */
  var pistaAtual = 0;
  function pista(i) {
    pistaAtual = i; var p = PISTAS[i];
    tela('<p class="olho">Cupom ' + (i + 1) + " de " + PISTAS.length + '</p><div class="prog"><i style="width:' + i / PISTAS.length * 100 + '%"></i></div><h1>' + p.q + '</h1><div id="alts">' +
      p.alt.map(function (a, k) { return '<button class="alt" data-a="responder" data-k="' + k + '">' + a + "</button>"; }).join("") +
      '</div><p class="aviso" id="msg" role="status"></p><p class="peq">A resposta está na parede, não no celular.</p>');
  }
  ACOES.responder = function (el) {
    var i = pistaAtual;
    if (+el.dataset.k !== PISTAS[i].certa) {
      el.classList.remove("treme"); void el.offsetWidth; el.classList.add("treme");
      document.getElementById("msg").textContent = "Cupom inválido. Olhe a parede de novo."; return;
    }
   
    document.querySelector(".prog i").style.width = (i + 1) / PISTAS.length * 100 + "%";
    document.getElementById("msg").textContent = "";
    document.getElementById("alts").innerHTML = '<div class="achou"><div class="big">' + BONUS[i][0] + '</div><p class="olho">Cupom aceito</p><p><b>' + BONUS[i][1] + "</b> liberado</p></div>";
    depois(function () { if (i + 1 < PISTAS.length) pista(i + 1); else liberada(); }, 1300);
  };

  /* ---------- 3. oferta desbloqueada ---------- */
  function liberada() {
    tela('<p class="olho c">' + PISTAS.length + " de " + PISTAS.length + ' cupons · acesso liberado</p><h1 class="c">Oferta <mark>desbloqueada</mark></h1>' +
      '<p class="c mute">Amizade vitalícia com o Landim, só para quem provou que está no quarto.</p>' +
      '<figure class="foto"><img src="fotos/landim-1.jpg" alt="Foto do Landim" onerror="this.parentNode.remove()"><figcaption>Landim. Imagem meramente ilustrativa.</figcaption></figure>' +
      '<div class="preco"><span class="selo">100% OFF</span><br><s>De R$ 997,00</s><strong id="preco">R$ 997,00</strong><span class="peq">sem juros · sem boleto · sem pegadinha</span></div>' +
      '<button class="btn pulsa" data-a="resgatar">RESGATAR MINHA OFERTA</button>' +
      '<p class="vagas">⏳ Restam <span id="vag">7</span> vagas neste quarto</p>' +
      "<h2>Seus bônus <span>liberados</span></h2><ul class=\"bonus\">" +
      BONUS.map(function (b, i) { return "<li>Bônus #" + (i + 1) + ": " + b[1] + "<small>" + b[2] + "</small></li>"; }).join("") + "</ul>" +
      '<div class="garantia">🛡️ <b>Garantia incondicional de 10 anos.</b><br>Se até ' + ANO_FIM + " você não estiver satisfeito, devolvemos todas as suas risadas.</div>" + rodape());
    confete();
    depois(function () { // o preço despenca
      var v = 997, alvo = document.getElementById("preco");
      var t = cada(function () { v = Math.max(0, v - 83); alvo.textContent = "R$ " + v + ",00"; if (!v) { clearInterval(t); } }, 90);
    }, 1200);
    var vag = 7;
    cada(function () { if (vag > 1) { vag--; var el = document.getElementById("vag"); if (el) el.textContent = vag; } }, 4000);
    avisosDeVenda();
  }
  ACOES.resgatar = function () { checkout(); };

  /* ---------- 4. checkout: nome e a frase do dia ---------- */
  function checkout() {
    tela('<p class="olho">Checkout · total R$ 0,00</p><h1>Só falta o <mark>seu nome</mark></h1>' +
      '<label class="cp" for="fnome">Seu nome</label><input type="text" id="fnome" autocomplete="off" maxlength="28" value="' + esc(S.nome) + '" placeholder="Como sai no certificado">' +
      '<label class="cp" for="ffrase">Uma frase que represente o dia de hoje</label><input type="text" id="ffrase" autocomplete="off" maxlength="70" value="' + esc(S.frase) + '" placeholder="Ex.: vim pela feijoada, fiquei pela parede">' +
      '<p class="peq" style="margin-top:6px">Sai no seu certificado e entra no mural de clientes.</p>' +
      '<label class="cp" for="cup">Tem cupom? <span class="peq">(opcional · está escrito na parede)</span></label>' +
      '<div class="linha"><input type="text" id="cup" autocapitalize="characters" autocomplete="off" placeholder="DIGITE O CUPOM"><button class="btn min" data-a="cupom">Aplicar</button></div>' +
      '<p class="aviso" id="cupmsg" role="status">' + (S.cupom ? "Cupom já aplicado ✓" : "") + "</p>" +
      '<p class="aviso" id="msg" role="alert"></p><button class="btn pulsa" data-a="finalizar">FINALIZAR COMPRA · R$ 0,00</button>');
  }
  ACOES.cupom = function () {
    var v = document.getElementById("cup").value.toUpperCase().replace(/[^A-Z0-9]/g, ""), m = document.getElementById("cupmsg");
    if (CUPONS.indexOf(v) >= 0) { S.cupom = true; m.textContent = "Cupom aceito! 100% de desconto sobre R$ 0,00 e bônus secreto liberado."; }
    else { m.textContent = "Cupom inválido. Procure melhor: a parede não mente."; }
  };
  ACOES.finalizar = function () {
    var campo = document.getElementById("fnome");
    S.nome = campo.value.trim(); S.frase = document.getElementById("ffrase").value.trim();
    if (!S.nome) {
      document.getElementById("msg").textContent = "Sem nome não tem nota fiscal.";
      campo.classList.remove("treme"); void campo.offsetWidth; campo.classList.add("treme"); campo.focus(); return;
    }
    fazerPedido(); salvar(); enviarAoMural(); aprovada(true);
  };

  /* ---------- 5. compra aprovada: certificado, compartilhar, mural de clientes, álbum ---------- */
  function aprovada(nova) {
   
    tela('<p class="olho c">' + (nova ? "Compra aprovada · pedido nº " + S.pedido.num : "Cliente reconhecido · desde " + S.pedido.txt) + "</p>" +
      '<h1 class="c">Está <mark>no papel</mark>, ' + esc(primeiroNome()) + "</h1>" +
      '<canvas id="cert" width="1080" height="1350" role="img" aria-label="Certificado de Amigo Vitalício do Landim em nome de ' + esc(S.nome) + '"></canvas>' +
      '<button class="btn" data-a="compartilhar">COMPARTILHAR CERTIFICADO</button>' +
      '<label class="btn oco">📷 ' + (S.selfie ? "Trocar a foto com o Landim" : "Colocar foto com o Landim") + '<input type="file" accept="image/*" capture="user" id="selfie" hidden></label>' +
      '<p class="aviso c" id="msg" role="status"></p>' +
      "<h2>Mural de <span>clientes</span></h2><div id=\"mural\"></div>" +
      "<h2>Álbum da <span>festa</span></h2>" +
      '<p class="peq" id="semfotos">As fotos de 21 e 22/11/2026 entram aqui depois do fim de semana.</p><div class="album" id="album"></div>' + rodape());
    if (nova) { confete(); }
    desenharCertificado(document.getElementById("cert"));
    document.getElementById("selfie").onchange = function () {
      var arq = this.files[0]; if (!arq) return;
      var img = new Image();
      img.onload = function () { // recorta em quadrado e reduz: a foto fica só neste celular
        var c = document.createElement("canvas"); c.width = c.height = 480;
        var l = Math.min(img.width, img.height);
        c.getContext("2d").drawImage(img, (img.width - l) / 2, (img.height - l) / 2, l, l, 0, 0, 480, 480);
        S.selfie = c.toDataURL("image/jpeg", 0.8); salvar(); aprovada(false);
      };
      img.src = URL.createObjectURL(arq);
    };
    pintarMural([]); lerMural();
    for (var i = 1; i <= FOTOS_DA_FESTA; i++) fotoDaFesta(i);
  }
  function fotoDaFesta(i) {
    var img = new Image();
    img.onload = function () {
      var album = document.getElementById("album"); if (!album) return;
      img.alt = "Foto da festa " + i; album.appendChild(img); document.getElementById("semfotos").hidden = true;
    };
    img.src = "fotos/festa-" + i + ".jpg";
  }
  ACOES.compartilhar = function () {
    var nomeArq = "certificado-amigo-do-landim.png";
    document.getElementById("cert").toBlob(function (blob) {
      var arq = new File([blob], nomeArq, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [arq] })) {
        navigator.share({ files: [arq], title: "Certificado de Amigo Vitalício", text: "Agora é oficial: sou amigo vitalício do Landim. Pedido nº " + S.pedido.num + "." }).catch(function () {});
      } else { // sem compartilhamento nativo: baixa a imagem
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nomeArq; a.click();
        document.getElementById("msg").textContent = "Imagem salva. Agora é só mandar no grupo.";
      }
    }, "image/png");
  };

  function quebrar(x, t, larg) {
    var ls = [], l = "";
    t.split(/\s+/).forEach(function (pal) { var ten = l ? l + " " + pal : pal; if (l && x.measureText(ten).width > larg) { ls.push(l); l = pal; } else l = ten; });
    if (l) ls.push(l); return ls;
  }
  function desenharCertificado(cv) {
    var x = cv.getContext("2d"), W = 1080, H = 1350, F = '"Helvetica Neue", Arial, sans-serif', OR = "#f26b21";
    function txt(t, y, fonte, cor) { x.font = fonte + " " + F; x.fillStyle = cor; x.fillText(t, W / 2, y); }
    x.fillStyle = "#f6f3ec"; x.fillRect(0, 0, W, H);
    x.strokeStyle = OR; x.lineWidth = 18; x.strokeRect(30, 30, W - 60, H - 60);
    x.strokeStyle = "#111"; x.lineWidth = 3; x.strokeRect(56, 56, W - 112, H - 112);
    x.textAlign = "center";
    txt("O F E R T A   D O   L A N D I M", 140, "900 30px", OR);
    txt("CERTIFICADO", 250, "900 104px", "#111");
    txt("DE AMIGO VITALÍCIO", 312, "900 46px", "#111");
    txt("Certificamos que", 395, "400 34px", "#444");
    var tam = 96; x.font = "900 " + tam + "px " + F;
    while (x.measureText(S.nome).width > 880 && tam > 40) { tam -= 4; x.font = "900 " + tam + "px " + F; }
    x.fillStyle = "#111"; x.fillText(S.nome, W / 2, 500);
    x.fillStyle = OR; x.fillRect(W / 2 - 220, 522, 440, 8);
    txt("adquiriu, pelo valor de R$ 0,00, amizade vitalícia", 590, "400 34px", "#222");
    txt("com o Landim, com garantia incondicional até " + ANO_FIM + ".", 636, "400 34px", "#222");
    if (S.frase) {
      txt("E declarou, sobre este dia:", 716, "400 30px", "#555");
      var ft = 54, linhas; x.font = "900 " + ft + "px " + F; linhas = quebrar(x, "“" + S.frase + "”", 860);
      if (linhas.length > 3) { ft = 42; x.font = "900 " + ft + "px " + F; linhas = quebrar(x, "“" + S.frase + "”", 860); }
      x.fillStyle = OR; linhas.slice(0, 4).forEach(function (l, i) { x.fillText(l, W / 2, 792 + i * (ft + 10)); });
    }
    if (S.cupom) txt("CUPOM DA PAREDE APLICADO · BÔNUS SECRETO LIBERADO", 1232, "900 24px", OR);
    txt("Válido até " + DATA_FIM + " · intransferível · não aceita devolução", 1268, "400 22px", "#666");
    // carimbo do pedido
    x.save(); x.translate(765, 1090); x.rotate(-0.09); x.strokeStyle = OR; x.lineWidth = 6; x.strokeRect(-200, -85, 400, 170);
    x.font = "900 33px " + F; x.fillStyle = OR; x.fillText("PEDIDO Nº " + S.pedido.num, 0, -22);
    x.font = "700 30px " + F; x.fillText(S.pedido.txt, 0, 22); x.font = "700 24px " + F; x.fillText("PAGO · R$ 0,00", 0, 60); x.restore();
    // à esquerda: a foto com o Landim, ou o selo de estouro
    var cx = 290, cy = 1090, r = 95;
    if (S.selfie) {
      var im = new Image();
      im.onload = function () {
        x.save(); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.clip(); x.drawImage(im, cx - r, cy - r, r * 2, r * 2); x.restore();
        x.beginPath(); x.arc(cx, cy, r, 0, 7); x.strokeStyle = OR; x.lineWidth = 8; x.stroke();
      };
      im.src = S.selfie;
    } else {
      x.save(); x.translate(cx, cy); x.rotate(-0.15); x.beginPath();
      for (var p = 0; p < 32; p++) { var raio = p % 2 ? 76 : 102, an = p * Math.PI / 16; x.lineTo(Math.cos(an) * raio, Math.sin(an) * raio); }
      x.closePath(); x.fillStyle = OR; x.fill(); x.font = "900 38px " + F; x.fillStyle = "#111"; x.fillText("100%", 0, -2); x.fillText("OFF", 0, 38); x.restore();
    }
  }

  /* ---------- mural de clientes ---------- */
  function pintarMural(deFora) {
    var el = document.getElementById("mural"); if (!el) return;
    var lista = [];
    if (S.frase) lista.push({ nome: primeiroNome(), frase: S.frase, quando: S.pedido.txt, meu: true });
    deFora.concat(FRASES_FIXAS).forEach(function (it) { // não repete a frase deste celular
      if (!(S.frase && it.frase === S.frase && it.nome === primeiroNome())) lista.push(it);
    });
    el.innerHTML = lista.length
      ? lista.map(function (it) {
          return '<div class="depo' + (it.meu ? " meu" : "") + '">“' + esc(it.frase) + "”<cite>★★★★★ · " + esc(it.nome) + (it.quando ? ", " + esc(it.quando) : "") + (it.meu ? " · você" : "") + "</cite></div>";
        }).join("")
      : '<p class="peq">Ninguém deixou frase ainda. Volte ao checkout e seja o primeiro.</p>';
  }
  function lerMural() {
    if (!MURAL.planilha) return;
    fetch("https://docs.google.com/spreadsheets/d/" + MURAL.planilha + "/gviz/tq?tqx=out:json&headers=1", { cache: "no-store" })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var linhas = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1)).table.rows;
        pintarMural(linhas.map(function (l) {
          var c = l.c; return { quando: (c[0] && c[0].f) || "", nome: String((c[1] && c[1].v) || "").split(" ")[0], frase: String((c[2] && c[2].v) || "") };
        }).filter(function (it) { return it.frase; }).reverse());
      }).catch(function () {});
  }
  function enviarAoMural() {
    if (!MURAL.form || !S.frase || S.enviado) return;
    var corpo = new URLSearchParams(); corpo.append(MURAL.campoNome, primeiroNome()); corpo.append(MURAL.campoFrase, S.frase);
    fetch("https://docs.google.com/forms/d/e/" + MURAL.form + "/formResponse", { method: "POST", mode: "no-cors", body: corpo })
      .then(function () { S.enviado = true; salvar(); }).catch(function () {});
  }

  /* ---------- 6. área do Landim: abre com um toque ---------- */
  ACOES.landim = function () { areaDoLandim(); };
  ACOES.sair = function () { if (S.pedido) aprovada(false); else entrada(); };
  function areaDoLandim() {
    var aberto = teste2027 || Date.now() >= ANIV.getTime();
    var tiles = [["Faturamento total", "R$ 0,00"], ["Reembolsos pedidos", "0"], ["Nota média", "5,0 ★"], ["Taxa de conversão", "100%"],
                 ["Vendas neste celular", lembrar() ? 1 : 0], ["Prazo de entrega", "vitalício"]];
    tela('<p class="olho">Área do Landim</p><h1>Fala, <mark>Landim</mark></h1>' +
      "<h2>Painel de <span>vendas</span></h2><div class=\"tiles\">" +
      tiles.map(function (t) { return '<div class="tile"><small>' + t[0] + "</small><b>" + t[1] + "</b></div>"; }).join("") +
      '</div><p class="peq" style="margin-top:8px">Números auditados por ninguém.</p>' +
      "<h2>Renovação de <span>2027</span></h2>" +
      (aberto ? '<div class="cadeado"><div class="big">🔓</div><b>1 ano de garantia cumprido.</b><p class="mute" style="margin:8px 0 0">Feliz aniversário, Landim. A amizade segue na garantia.</p></div>'
              : '<div class="cadeado"><div class="big">🔒</div>Abre no seu próximo aniversário, em ' + DATA_ANIV + '.<br>Faltam <b id="falta">…</b></div>') +
      '<button class="btn oco" data-a="sair">Voltar</button>');
    if (aberto) return;
    var tique = function () {
      var seg = Math.max(0, Math.floor((ANIV.getTime() - Date.now()) / 1000)), el = document.getElementById("falta");
      if (el) el.textContent = Math.floor(seg / 86400) + " dias " + dois(Math.floor(seg % 86400 / 3600)) + ":" + dois(Math.floor(seg % 3600 / 60)) + ":" + dois(seg % 60);
    };
    tique(); cada(tique, 1000);
  }

  /* ---------- começo. Para testar estados: #aprovado, #oferta, #landim, #2027, #zerar ---------- */
  var teste = location.hash.slice(1), mem = lembrar();
  if (teste === "zerar") { localStorage.removeItem(CHAVE); mem = null; }
  if (teste === "aprovado") { S.nome = "Fulano de Teste"; S.frase = "Vim pela feijoada, fiquei pela parede"; fazerPedido(); aprovada(true); }
  else if (teste === "oferta") liberada();
  else if (teste === "landim" || teste === "2027") { teste2027 = teste === "2027"; if (mem && mem.pedido) S = mem; areaDoLandim(); }
  else if (mem && mem.pedido) { S = mem; aprovada(false); }
  else entrada();
})();
</script>
